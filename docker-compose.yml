services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinicflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/clinicflow
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 1d
    command: sh -c "npx prisma migrate deploy && node src/server.js"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
